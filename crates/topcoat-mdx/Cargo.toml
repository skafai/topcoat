[package]
name = "topcoat-mdx"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
default = ["macro"]
macro = ["dep:topcoat-mdx-macro"]
page = ["macro", "dep:topcoat-core", "dep:topcoat-router", "dep:serde", "dep:inventory", "dep:anyhow"]

[dependencies]
topcoat-mdx-macro = { workspace = true, optional = true }
topcoat-core = { workspace = true, optional = true }
topcoat-router = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
inventory = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }

[dev-dependencies]
topcoat = { workspace = true, features = ["mdx"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
