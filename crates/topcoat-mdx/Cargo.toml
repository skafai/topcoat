[package]
name = "topcoat-mdx"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
topcoat-mdx-macro.workspace = true

[dev-dependencies]
topcoat = { workspace = true, features = ["mdx"] }
# Doc examples deserialize frontmatter, so they need the same formats the
# macro parses. Versions match topcoat-mdx-macro's.
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.0"
toml = "0.8"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
