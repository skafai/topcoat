[package]
name = "topcoat-mdx-macro"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[features]
discover = []
# Mirrors topcoat-mdx's feature of the same name, which turns it on. The macro
# only reads it to tell an author that `frontmatter = Type` needs the runtime
# support enabled, rather than letting the generated code fail on a missing
# module.
frontmatter = []

[dependencies]
# markdown version must stay synchronized with topcoat-mdx-grammar;
# both crates use markdown-rs types directly (to_mdast, mdast::Node).
markdown = "1.0"
topcoat-mdx-grammar.workspace = true
topcoat-view-grammar.workspace = true
topcoat-core-grammar.workspace = true

proc-macro2.workspace = true
quote.workspace = true
serde = "1"
serde-saphyr = "1.0"
serde-value = "0.7"
toml = "0.8"
heck = { workspace = true }
ignore = { workspace = true }
syn = { workspace = true, features = ["full"] }

[dev-dependencies]
topcoat = { workspace = true, features = ["mdx", "mdx-frontmatter", "view"] }
topcoat-mdx-grammar.workspace = true
topcoat-view-grammar.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
markdown = "1.0"
# Versions must match the ones above: tests deserialize the same frontmatter
# the macro does, and two majors of a serde format in one crate would diverge.
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.0"
toml = "0.8"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
