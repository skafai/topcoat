[package]
name = "topcoat-mdx-macro"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
# markdown version must stay synchronized with topcoat-mdx-grammar;
# both crates use markdown-rs types directly (to_mdast, mdast::Node).
markdown = "1.0"
topcoat-mdx-grammar.workspace = true
topcoat-view-grammar.workspace = true
topcoat-core-grammar.workspace = true
proc-macro-crate.workspace = true

proc-macro2.workspace = true
quote.workspace = true
serde = "1"
serde-saphyr = "1.0"
serde-value = "0.7"
syn = { workspace = true, features = ["full"] }

[dev-dependencies]
topcoat = { workspace = true, features = ["mdx", "view"] }
topcoat-mdx-grammar.workspace = true
topcoat-view-grammar.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
markdown = "1.0"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
