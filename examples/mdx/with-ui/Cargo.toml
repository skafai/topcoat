[package]
name = "mdx-with-ui"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
topcoat = { workspace = true, features = ["mdx", "serve", "view", "router", "font-fontsource", "icon-iconify", "tailwind", "ui", "asset", "discover"] }

[build-dependencies]
topcoat = { path = "../../../crates/topcoat/", default-features = false, features = ["icon-iconify", "tailwind"] }

[dev-dependencies]
topcoat-ui.workspace = true

[lints]
workspace = true
